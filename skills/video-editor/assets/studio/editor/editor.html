<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio</title>
<link rel="stylesheet" href="/editor/editor.css">
</head>
<body>
<header class="bar">
  <div class="title"><strong id="template-name">Studio</strong><span id="status" role="status" aria-live="polite">Loading</span></div>
  <div id="save-conflict" class="actions" hidden aria-label="Resolve saved project conflict">
    <button id="load-saved" type="button">Load saved version</button>
    <button id="keep-edits" type="button">Keep my edits</button>
  </div>
  <div class="actions">
    <label class="inline">Format <select id="format"></select></label>
    <button id="undo" type="button" title="Undo (Cmd+Z)">Undo</button>
    <button id="redo" type="button" title="Redo (Shift+Cmd+Z)">Redo</button>
    <button id="draft" type="button">Render draft</button>
    <button id="final" type="button" class="primary">Render final</button>
  </div>
</header>
<main>
  <section class="preview" aria-label="Preview">
    <div class="viewport" id="viewport">
      <div class="frame" id="frame">
        <iframe id="stage" src="/stage?proxy=1" title="Video preview" tabindex="-1"></iframe>
        <div class="safe" id="safe" hidden></div>
      </div>
    </div>
    <div class="transport">
      <button id="play" type="button" aria-label="Play">Play</button>
      <button id="back" type="button" aria-label="Back one frame">‹</button>
      <button id="fwd" type="button" aria-label="Forward one frame">›</button>
      <div class="scrub"><input id="time" type="range" min="0" max="1" step="0.001" value="0" aria-label="Timeline position"><div id="marks" class="marks"></div></div>
      <output id="clock">0.00</output>
    </div>
    <div class="toggles">
      <label class="inline"><input id="safe-on" type="checkbox"> Safe area</label>
      <label class="inline"><input id="still-on" type="checkbox"> Still layout</label>
      <label class="inline"><input id="sound-on" type="checkbox"> Sound</label>
      <button id="note-add" type="button">Pin note here</button>
    </div>
  </section>
  <aside class="panel" aria-label="Controls">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="controls" aria-selected="true" type="button">Edit</button>
      <button role="tab" data-tab="story" aria-selected="false" type="button">Story</button>
      <button role="tab" data-tab="checks" aria-selected="false" type="button">Checks <span id="check-count"></span></button>
      <button role="tab" data-tab="exports" aria-selected="false" type="button">Exports</button>
    </div>
    <div class="tab" id="tab-controls"></div>
    <div class="tab" id="tab-story" hidden></div>
    <div class="tab" id="tab-checks" hidden>
      <button id="full-check" type="button">Run full check</button>
      <p class="hint">Live checks update as you edit. The full check also measures contrast against the real image.</p>
      <ul id="checks" class="list"></ul>
    </div>
    <div class="tab" id="tab-exports" hidden>
      <div id="job" class="job" hidden><progress id="job-bar" max="1" value="0"></progress><span id="job-text"></span></div>
      <ul id="exports" class="list"></ul>
    </div>
  </aside>
</main>
<audio id="audio" preload="auto"></audio>
<script type="module" src="/editor/editor.js"></script>
</body>
</html>
